
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PoketCare Student Financial Management System">

    <title>PoketCare | Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container-fluid">
        <div class="row min-vh-100">

            <!-- LEFT SIDE: BACKGROUND AND LOGO -->
            <div class="col-md-6 left-section">

                <div class="background-overlay"></div>

                <div class="left-content">
                    <img src="images/logo.png"
                         alt="PoketCare Logo"
                         class="poketcare-logo">

                    <h1>Welcome to PoketCare</h1>

                    <p>
                        Your Smart Student Financial
                        Management System
                    </p>
                </div>

            </div>

            <!-- RIGHT SIDE: LOGIN -->
            <div class="col-md-6 right-section">

                <div class="login-box">

                    <h2>Welcome Back!</h2>

                    <p class="login-description">
                        Login to access your financial dashboard.
                    </p>

                    <!-- Error Message -->
                    <div id="errorMessage"
                         class="alert alert-danger d-none"
                         role="alert">
                        Invalid username or password.
                    </div>

                    <form id="loginForm">

                        <!-- Username -->
                        <div class="mb-4">
                            <label for="username" class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   value="admin"
                                   autocomplete="username"
                                   required>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="password"
                                   value="12345"
                                   readonly>
                        </div>

                        <!-- Login Button -->
                        <button type="submit"
                                class="btn login-btn w-100">
                            Login
                            <i class="bi bi-box-arrow-in-right ms-2"></i>
                        </button>

                    </form>

                    <p class="login-footer">
                        © 2026 PoketCare. All Rights Reserved.
                    </p>

                </div>

            </div>

        </div>
    </main>

    <!-- Custom JavaScript -->
    <script src="js/login.js"></script>

</body>
</html>
